services:
  mysql:
    image: mysql:8.4
    container_name: baton-mysql
    environment:
      MYSQL_DATABASE: baton
      MYSQL_USER: baton
      MYSQL_PASSWORD: baton
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - baton-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  baton-mysql-data:
